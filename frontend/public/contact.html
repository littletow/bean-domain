<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系作者 - 豆子工具</title>
    <style>
        /* 基础变量 */
        :root {
            --bg-color: #fdfcf0;
            --card-bg: #ffffff;
            --primary: #facc15;
            /* yellow-400 */
            --text-dark: #1e293b;
            /* slate-800 */
            --text-light: #94a3b8;
            /* slate-400 */
            --border-orange: #ffedd5;
            /* orange-100 */
            --bg-soft: #f8fafc;
            /* slate-50 */
            --bg-accent: #fff7ed;
            /* orange-50 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-dark);
        }

        /* 主容器 */
        .card {
            max-width: 28rem;
            /* max-w-md */
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-orange);
            text-align: center;
        }

        /* Logo 部分 */
        .logo-box {
            width: 80px;
            height: 80px;
            background-color: var(--primary);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 10px 15px -3px rgba(250, 204, 21, 0.2);
        }

        .logo-text {
            color: white;
            font-weight: 900;
            font-size: 1.875rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.875rem;
            margin-bottom: 40px;
        }

        /* 二维码区域 */
        .qr-section {
            background-color: var(--bg-soft);
            padding: 24px;
            border-radius: 32px;
            margin-bottom: 32px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .qr-section:hover {
            transform: scale(1.02);
        }

        .qr-image {
            width: 160px;
            height: 160px;
            display: block;
            margin: 0 auto;
            border-radius: 12px;
        }

        .qr-tag {
            margin-top: 16px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            /* slate-500 */
        }

        /* 支持作者提示 */
        .support-hint {
            margin: 28px 0 32px;
            padding: 20px 22px;
            font-size: 0.82rem;
            line-height: 1.85;
            color: #475569;
            /* slate-600 */
            background-color: #fffef3;
            border-radius: 20px;
            border: 1px dashed #fde68a;
            /* amber-200 */
            text-align: left;
        }

        /* 底部联系条 */
        .contact-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background-color: var(--bg-accent);
            border-radius: 16px;
            text-align: left;
        }

        .icon {
            font-size: 1.25rem;
        }

        .label {
            color: var(--text-light);
            font-size: 0.75rem;
        }

        .value {
            font-weight: 700;
            color: #334155;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <!-- 头像/Logo -->
        <div class="logo-box">
            <span class="logo-text">B</span>
        </div>

        <h1>联系作者</h1>
        <p class="subtitle">关注“技术源泉”公众号，获取最新版与技术支持</p>

        <!-- 小程序码/公众号码 -->
        <!-- 注意：确保图片放在 frontend/public/images/techsrc.webp -->
        <div class="qr-section">
            <img src="/images/techsrc.webp" alt="技术源泉" class="qr-image">
            <p class="qr-tag">微信扫一扫 · 公众号</p>
        </div>

        <!-- 支持作者说明 -->
        <div class="support-hint">
            本项目由个人独立维护，服务器与域名均为自费。<br />
            如果你觉得它对你有帮助，欢迎关注公众号支持一下～<br />
            可在文章底部赞赏，或进入小程序「我的」页点击
            <strong>支持作者</strong>，看一段广告，这对我真的很重要 ❤️
        </div>

        <!-- 联系方式 -->
        <div class="contact-bar">
            <span class="icon">📩</span>
            <div>
                <p class="label">反馈/投诉邮件</p>
                <p class="value">eagle.mon@qq.com</p>
            </div>
        </div>
    </div>
</body>

</html>
